<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="BioStat Studio architecture: the Electron shell reaches an authenticated loopback Python service through a typed preload bridge; data_intake, planner and analyses produce a single typed result contract; visuals and reporting derive the bilingual Word report from that contract.">
  <title>BioStat Studio architecture</title>
  <desc>The source workbook is opened read-only and fingerprinted; the renderer has no OS access and privileged calls pass through the typed preload bridge; the Python service listens on loopback with an ephemeral port and a session token; no analysis runs without an approved plan revision; tables, figures and narrative are derived from one typed result contract.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#4B5B51"/>
    </marker>
    <marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#AF5230"/>
    </marker>
    <marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#6C7F71"/>
    </marker>
    <style>
      .box   { fill:#FFFFFF; stroke:#C8D3C6; stroke-width:1.2; }
      .t     { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:15px; fill:#141F19; }
      .s     { font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:11.5px; fill:#7B8C81; }
      .el    { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:11.5px; fill:#4B5B51; }
      .zl    { font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:11px; fill:#AF5230; letter-spacing:.4px; }
      .edge  { fill:none; stroke:#4B5B51; stroke-width:1.4; stroke-opacity:.55; marker-end:url(#ar); }
      .bnd   { fill:none; stroke:#AF5230; stroke-width:1.7; stroke-dasharray:7 5; marker-end:url(#art); marker-start:url(#art); }
      .aud   { fill:none; stroke:#6C7F71; stroke-width:1.4; stroke-dasharray:2.5 4.5; marker-end:url(#ars); }
      .audb  { fill:none; stroke:#6C7F71; stroke-width:1.4; stroke-dasharray:2.5 4.5; marker-end:url(#ars); marker-start:url(#ars); }
      .zone  { fill:none; stroke:#AF5230; stroke-opacity:.5; stroke-width:1; stroke-dasharray:3 6; }
      .lg    { font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:11.5px; fill:#7B8C81; }
      .rm    { fill:none; stroke:#B3BFB4; stroke-width:1; stroke-dasharray:4 4; }
      .rmt   { font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; font-size:11.5px; fill:#8B9A90; }
    </style>
  </defs>

  <rect x="1" y="1" width="998" height="758" rx="14" fill="#F5F7F3" stroke="#DFE6DC"/>

  <rect class="zone" x="330" y="248" width="262" height="104" rx="12"/>
  <text class="zl" x="330" y="240">loopback · 127.0.0.1 · session token</text>

  <path id="e1"  class="edge" d="M150,222 L150,268"/>
  <path id="e2"  class="edge" d="M150,332 L150,378"/>
  <path id="e3"  class="bnd"  d="M240,378 L370,332"/>
  <path id="e4"  class="aud"  d="M260,70 L660,70"/>
  <path id="e5"  class="edge" d="M504,268 Q620,180 735,102"/>
  <path id="e6"  class="edge" d="M553,268 L687,222"/>
  <path id="e7"  class="edge" d="M780,102 L780,158"/>
  <path id="e8"  class="edge" d="M780,222 L780,278"/>
  <path id="e9"  class="edge" d="M780,342 L780,398"/>
  <path id="e10" class="edge" d="M780,462 L780,518"/>
  <path id="e11" class="edge" d="M780,582 L780,638"/>
  <path id="e12" class="audb" d="M460,332 L460,478"/>
  <path id="e13" class="edge" d="M460,268 L460,172"/>

  <circle r="4.2" fill="#14503C"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0s"><mpath href="#e1" xlink:href="#e1"/></animateMotion></circle>
  <circle r="4.2" fill="#14503C"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.2s"><mpath href="#e2" xlink:href="#e2"/></animateMotion></circle>
  <circle r="4.6" fill="#AF5230"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.4s"><mpath href="#e3" xlink:href="#e3"/></animateMotion></circle>
  <circle r="3.6" fill="#6C7F71"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.1s"><mpath href="#e4" xlink:href="#e4"/></animateMotion></circle>
  <circle r="4.2" fill="#14503C"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.6s"><mpath href="#e5" xlink:href="#e5"/></animateMotion></circle>
  <circle r="4.2" fill="#14503C"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.8s"><mpath href="#e6" xlink:href="#e6"/></animateMotion></circle>
  <circle r="4.2" fill="#14503C"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.0s"><mpath href="#e7" xlink:href="#e7"/></animateMotion></circle>
  <circle r="4.2" fill="#14503C"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.2s"><mpath href="#e8" xlink:href="#e8"/></animateMotion></circle>
  <circle r="4.2" fill="#14503C"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.4s"><mpath href="#e9" xlink:href="#e9"/></animateMotion></circle>
  <circle r="4.2" fill="#14503C"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.6s"><mpath href="#e10" xlink:href="#e10"/></animateMotion></circle>
  <circle r="4.2" fill="#14503C"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.8s"><mpath href="#e11" xlink:href="#e11"/></animateMotion></circle>
  <circle r="3.6" fill="#6C7F71"><animateMotion dur="3.4s" repeatCount="indefinite" begin="0.5s"><mpath href="#e12" xlink:href="#e12"/></animateMotion></circle>
  <circle r="4.2" fill="#14503C"><animateMotion dur="3.4s" repeatCount="indefinite" begin="1.1s"><mpath href="#e13" xlink:href="#e13"/></animateMotion></circle>

  <text class="el" x="164" y="249">typed invoke</text>
  <text class="el" x="164" y="359">IPC</text>
  <text class="el" x="306" y="352" text-anchor="middle">spawn · ephemeral port · token</text>
  <text class="el" x="460" y="56"  text-anchor="middle">read-only · fingerprint</text>
  <text class="el" x="474" y="222">standalone tool · no dataset</text>
  <text class="el" x="572" y="188">import job</text>
  <text class="el" x="620" y="262" text-anchor="middle">confirmed metadata</text>
  <text class="el" x="794" y="134">structural profile</text>
  <text class="el" x="794" y="254">approved plan revision</text>
  <text class="el" x="794" y="374">estimate · 95% CI · p</text>
  <text class="el" x="794" y="494">one result contract</text>
  <text class="el" x="794" y="614">Results (EN/TR)</text>
  <text class="el" x="474" y="409">autosave · versions</text>

  <g>
    <rect class="box" x="40" y="38" width="220" height="64" rx="10"/>
    <rect x="42.6" y="47" width="5" height="46" rx="2.5" fill="#6C7F71"/>
    <text class="t" x="62" y="67">Source .xlsx</text>
    <text class="s" x="62" y="85">read-only · never overwritten</text>
  </g>
  <g>
    <rect class="box" x="40" y="158" width="220" height="64" rx="10"/>
    <rect x="42.6" y="167" width="5" height="46" rx="2.5" fill="#4A6076"/>
    <text class="t" x="62" y="187">Renderer</text>
    <text class="s" x="62" y="205">Clinical Calm React · no OS access</text>
  </g>
  <g>
    <rect class="box" x="40" y="268" width="220" height="64" rx="10"/>
    <rect x="42.6" y="277" width="5" height="46" rx="2.5" fill="#4A6076"/>
    <text class="t" x="62" y="297">Preload Bridge</text>
    <text class="s" x="62" y="315">typed, narrow IPC surface</text>
  </g>
  <g>
    <rect class="box" x="40" y="378" width="220" height="64" rx="10"/>
    <rect x="42.6" y="387" width="5" height="46" rx="2.5" fill="#4A6076"/>
    <text class="t" x="62" y="407">Electron Main</text>
    <text class="s" x="62" y="425">lifecycle · sidecar · api-proxy</text>
  </g>

  <g>
    <rect class="box" x="355" y="108" width="210" height="64" rx="10"/>
    <rect x="357.6" y="117" width="5" height="46" rx="2.5" fill="#14503C"/>
    <text class="t" x="377" y="137">power</text>
    <text class="s" x="377" y="155">a-priori power · no dataset</text>
  </g>
  <g>
    <rect class="box" x="355" y="268" width="210" height="64" rx="10"/>
    <rect x="357.6" y="277" width="5" height="46" rx="2.5" fill="#AF5230"/>
    <text class="t" x="377" y="297">service</text>
    <text class="s" x="377" y="315">app · jobs · security</text>
  </g>
  <g>
    <rect class="box" x="355" y="478" width="210" height="64" rx="10"/>
    <rect x="357.6" y="487" width="5" height="46" rx="2.5" fill="#6C7F71"/>
    <text class="t" x="377" y="507">projects</text>
    <text class="s" x="377" y="525">.biostat · versions · audit trail</text>
  </g>

  <g>
    <rect class="box" x="660" y="38" width="240" height="64" rx="10"/>
    <rect x="662.6" y="47" width="5" height="46" rx="2.5" fill="#14503C"/>
    <text class="t" x="682" y="67">data_intake</text>
    <text class="s" x="682" y="85">xlsx · profile · fingerprint</text>
  </g>
  <g>
    <rect class="box" x="660" y="158" width="240" height="64" rx="10"/>
    <rect x="662.6" y="167" width="5" height="46" rx="2.5" fill="#14503C"/>
    <text class="t" x="682" y="187">planner</text>
    <text class="s" x="682" y="205">deterministic choice · approval gate</text>
  </g>
  <g>
    <rect class="box" x="660" y="278" width="240" height="64" rx="10"/>
    <rect x="662.6" y="287" width="5" height="46" rx="2.5" fill="#14503C"/>
    <text class="t" x="682" y="307">analyses</text>
    <text class="s" x="682" y="325">Welch t · ANOVA · χ² · rank · regression</text>
  </g>
  <g>
    <rect class="box" x="660" y="398" width="240" height="64" rx="10"/>
    <rect x="662.6" y="407" width="5" height="46" rx="2.5" fill="#6C7F71"/>
    <text class="t" x="682" y="427">contracts</text>
    <text class="s" x="682" y="445">one typed result contract</text>
  </g>
  <g>
    <rect class="box" x="660" y="518" width="240" height="64" rx="10"/>
    <rect x="662.6" y="527" width="5" height="46" rx="2.5" fill="#14503C"/>
    <text class="t" x="682" y="547">visuals · reporting</text>
    <text class="s" x="682" y="565">figures + bilingual Word assembly</text>
  </g>
  <g>
    <rect class="box" x="660" y="638" width="240" height="64" rx="10"/>
    <rect x="662.6" y="647" width="5" height="46" rx="2.5" fill="#6C7F71"/>
    <text class="t" x="682" y="667">Results .docx</text>
    <text class="s" x="682" y="685">EN default · TR option</text>
  </g>

  <g>
    <rect class="rm" x="40" y="580" width="540" height="44" rx="9"/>
    <text class="rmt" x="60" y="607">roadmap: ml · survival · mixed models · meta-analysis · CSV/SAV import</text>
  </g>

  <g>
    <line x1="45" y1="654" x2="80" y2="654" stroke="#4B5B51" stroke-opacity=".55" stroke-width="1.4"/>
    <text class="lg" x="90" y="658">data flow</text>
    <line x1="45" y1="680" x2="80" y2="680" stroke="#AF5230" stroke-width="1.7" stroke-dasharray="7 5"/>
    <text class="lg" x="90" y="684">authenticated loopback boundary</text>
    <line x1="45" y1="706" x2="80" y2="706" stroke="#6C7F71" stroke-width="1.4" stroke-dasharray="2.5 4.5"/>
    <text class="lg" x="90" y="710">read-only source · persistence and audit trail</text>
  </g>
</svg>
