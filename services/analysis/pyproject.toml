[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biostat-service"
version = "0.1.0"
description = "Local analysis service for BioStat Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2.7,<3",
    "pandas>=2.0,<3",
    "openpyxl>=3.1,<4",
    "scipy>=1.10,<2",
    "statsmodels>=0.14,<1",
    "matplotlib>=3.7,<4",
    "python-docx>=1.1,<2",
    "uvicorn>=0.29,<1",
    "pyinstaller>=6.0,<7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["biostat_service*"]
